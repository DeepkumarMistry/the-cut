<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>The Cut — Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root {
  --bg:#0a0a0a; --surface:#111111; --border:#1e1e1e; --accent:#c8f542;
  --text:#f0f0f0; --muted:#555; --dim:#2a2a2a; --shadow:rgba(0,0,0,0.5);
}
[data-theme="light"] {
  --bg:#f2f2ee; --surface:#ffffff; --border:#e0e0d8; --accent:#5a9e00;
  --text:#111111; --muted:#999; --dim:#eaeae6; --shadow:rgba(0,0,0,0.07);
}

html,body { min-height:100vh; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; transition:background 0.3s,color 0.3s; }
body { display:flex; flex-direction:column; align-items:center; padding-bottom:80px; }

/* NAV */
.nav-bar { width:100%; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:center; gap:4px; padding:0 16px; position:sticky; top:0; z-index:100; }
.nav-link { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); text-decoration:none; padding:14px 20px; border-bottom:2px solid transparent; transition:color 0.2s,border-color 0.2s; }
.nav-link:hover { color:var(--text); }
.nav-link.active { color:var(--accent); border-bottom-color:var(--accent); }

/* HERO */
.hero { width:100%; padding:24px 20px 36px; display:flex; flex-direction:column; align-items:center; text-align:center; border-bottom:1px solid var(--border); background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(200,245,66,0.06) 0%,transparent 70%); }
.hero-controls { width:100%; display:flex; justify-content:flex-end; gap:8px; align-items:center; margin-bottom:20px; }
.theme-toggle { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:7px 13px; cursor:pointer; font-size:15px; color:var(--text); }
.sync-pill { display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:7px 13px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; cursor:pointer; }
.sync-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; transition:background 0.4s; }
.sync-dot.synced { background:var(--accent); }
.sync-dot.syncing { background:#f5a623; animation:pulse 0.8s infinite; }
.sync-dot.error { background:#ff6b6b; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
.hero-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(44px,12vw,100px); letter-spacing:clamp(3px,2vw,8px); color:var(--accent); line-height:1; margin-bottom:2px; }
.hero-sub { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; }

/* LAYOUT */
.page-body { width:100%; max-width:1400px; padding:24px 16px 60px; }
@media(min-width:901px){ .page-body{ padding:40px 32px 80px; } }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.grid-full { margin-bottom:20px; }
@media(max-width:900px){ .grid-2{ grid-template-columns:1fr; } .card{ padding:20px 18px; } }
.card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px; box-shadow:0 2px 16px var(--shadow); }
.card-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }

/* TODAY CARD */
.today-hero { background:var(--accent); border-radius:12px; padding:20px; }
.today-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.today-day-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; color:#3a4a00; text-transform:uppercase; }
.today-name { font-family:'Bebas Neue',sans-serif; font-size:36px; color:#0a0a0a; line-height:1; margin:4px 0 4px; letter-spacing:2px; }
.today-focus { font-size:13px; color:#3a4a00; font-weight:300; }
.today-btns { display:flex; flex-direction:column; gap:8px; align-items:flex-end; flex-shrink:0; }
.start-btn { background:#0a0a0a; color:var(--accent); border:none; border-radius:8px; padding:10px 16px; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:500; cursor:pointer; white-space:nowrap; }
.log-btn { background:rgba(0,0,0,0.15); color:#0a0a0a; border:none; border-radius:8px; padding:8px 14px; font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; cursor:pointer; white-space:nowrap; }
.log-btn.logged { opacity:0.6; cursor:default; }
.rest-hero { background:var(--dim); border-radius:12px; padding:20px; text-align:center; }
.rest-title { font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:2px; color:var(--muted); }
.rest-sub { font-size:13px; color:var(--muted); margin-top:4px; }
.ex-list { margin-top:14px; border-top:1px solid rgba(0,0,0,0.15); padding-top:12px; display:flex; flex-direction:column; gap:8px; }
.ex-row { display:flex; justify-content:space-between; align-items:center; }
.ex-name { font-size:14px; color:#111; }
.ex-sets { font-family:'DM Mono',monospace; font-size:12px; color:#3a4a00; }

/* WEEK STRIP */
.week-strip { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.day-chip { border-radius:10px; padding:10px 4px; text-align:center; border:1.5px solid var(--border); background:var(--bg); }
.day-chip.done { background:var(--accent); border-color:var(--accent); }
.day-chip.is-today { border-color:var(--accent); }
.day-chip.rest-day { background:var(--dim); border-color:var(--border); }
.dc-letter { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); font-weight:500; }
.day-chip.done .dc-letter,.day-chip.done .dc-type { color:#3a4a00; }
.dc-icon { font-size:15px; margin-top:5px; }
.dc-type { font-family:'DM Mono',monospace; font-size:8px; color:var(--muted); margin-top:3px; letter-spacing:0.5px; text-transform:uppercase; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* COMPLIANCE */
.comp-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
.comp-stat { background:var(--dim); border-radius:10px; padding:14px; text-align:center; }
.comp-val { font-family:'Bebas Neue',sans-serif; font-size:32px; line-height:1; color:var(--text); }
.comp-val.green { color:var(--accent); }
.comp-lbl { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; margin-top:4px; }
.bar-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.bar-lbl { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); width:60px; flex-shrink:0; }
.bar-track { flex:1; height:8px; background:var(--dim); border-radius:99px; overflow:hidden; }
.bar-fill { height:100%; border-radius:99px; background:var(--accent); transition:width 0.6s ease; }
.bar-pct { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); width:32px; text-align:right; flex-shrink:0; }

/* SPLIT LIST */
.split-list { display:flex; flex-direction:column; gap:8px; }
.split-row { display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px 14px; cursor:pointer; transition:border-color 0.2s; }
.split-row:hover { border-color:var(--accent); }
.split-dow { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); width:30px; flex-shrink:0; }
.split-info { flex:1; }
.split-name { font-size:15px; color:var(--text); font-weight:500; }
.split-muscles { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); margin-top:2px; }
.split-arrow { color:var(--muted); font-size:16px; }

/* EDIT MODAL */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; align-items:flex-end; justify-content:center; }
.modal-overlay.open { display:flex; }
.modal { background:var(--surface); border-radius:20px 20px 0 0; padding:28px 20px 40px; width:100%; max-width:600px; max-height:90vh; overflow-y:auto; }
@media(min-width:600px){ .modal-overlay{ align-items:center; padding:20px; } .modal{ border-radius:16px; } }
.modal-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:2px; color:var(--text); margin-bottom:4px; }
.modal-sub { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:20px; }
.modal-close { float:right; background:var(--dim); border:none; border-radius:20px; color:var(--muted); font-size:18px; width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.field-label { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; display:block; margin-bottom:6px; margin-top:16px; }
.field-input { width:100%; background:var(--dim); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; padding:12px 14px; outline:none; transition:border-color 0.2s; }
.field-input:focus { border-color:var(--accent); }
.field-input::placeholder { color:var(--muted); }
.ex-editor { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
.ex-edit-row { display:grid; grid-template-columns:1fr 56px 56px 36px; gap:6px; align-items:center; }
.ex-edit-input { background:var(--dim); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; padding:10px 8px; outline:none; width:100%; transition:border-color 0.2s; }
.ex-edit-input:focus { border-color:var(--accent); }
.ex-edit-input::placeholder { color:var(--muted); font-size:11px; }
.ex-del-btn { background:none; border:1px solid var(--border); border-radius:8px; color:var(--muted); font-size:16px; width:36px; height:40px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.ex-del-btn:hover { border-color:#ff6b6b; color:#ff6b6b; }
.add-ex-btn { background:none; border:1px dashed var(--border); border-radius:8px; color:var(--muted); font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; padding:10px; cursor:pointer; width:100%; margin-top:4px; }
.add-ex-btn:hover { border-color:var(--accent); color:var(--accent); }
.rest-toggle { display:flex; align-items:center; gap:12px; margin-top:16px; }
.rest-toggle label { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; cursor:pointer; }
.save-modal-btn { width:100%; background:var(--accent); border:none; border-radius:10px; color:#0a0a0a; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:3px; text-transform:uppercase; font-weight:500; padding:16px; cursor:pointer; margin-top:24px; }
.ex-header { display:grid; grid-template-columns:1fr 56px 56px 36px; gap:6px; margin-bottom:4px; }
.ex-header span { font-family:'DM Mono',monospace; font-size:9px; letter-spacing:1px; color:var(--muted); text-transform:uppercase; padding:0 8px; }

/* ═══════════════════════════════════════
   GUIDED WORKOUT SCREEN
═══════════════════════════════════════ */
#guidedScreen {
  display:none; position:fixed; inset:0; background:var(--bg);
  z-index:300; flex-direction:column; align-items:center;
  overflow:hidden;
}
#guidedScreen.open { display:flex; }

.guided-header {
  width:100%; padding:16px 20px; display:flex; justify-content:space-between;
  align-items:center; border-bottom:1px solid var(--border); flex-shrink:0;
}
.guided-workout-name { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; }
.guided-close { background:var(--dim); border:none; border-radius:20px; color:var(--muted); font-size:14px; padding:6px 14px; cursor:pointer; font-family:'DM Mono',monospace; letter-spacing:1px; }

/* Progress dots */
.guided-progress { display:flex; gap:6px; padding:16px 20px 0; flex-shrink:0; flex-wrap:wrap; justify-content:center; }
.prog-dot { width:8px; height:8px; border-radius:50%; background:var(--dim); transition:all 0.3s; }
.prog-dot.done-ex { background:var(--accent); }
.prog-dot.active-ex { background:var(--accent); transform:scale(1.4); }

/* Main exercise area */
.guided-main {
  flex:1; width:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:20px;
  text-align:center; overflow:hidden;
}

.guided-ex-num { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:12px; }
.guided-ex-name { font-family:'Bebas Neue',sans-serif; font-size:clamp(36px,8vw,64px); color:var(--text); line-height:1; letter-spacing:2px; margin-bottom:8px; }
.guided-how-to { font-size:14px; color:var(--muted); font-weight:300; line-height:1.6; max-width:360px; margin:0 auto 32px; }

/* Set indicator */
.set-indicator { display:flex; gap:8px; justify-content:center; margin-bottom:28px; }
.set-dot { width:10px; height:10px; border-radius:50%; border:1.5px solid var(--muted); background:transparent; transition:all 0.2s; }
.set-dot.done-set { background:var(--accent); border-color:var(--accent); }
.set-dot.active-set { border-color:var(--accent); transform:scale(1.3); }

/* Rep counter */
.rep-counter-wrap { margin-bottom:32px; }
.rep-label { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
.rep-num { font-family:'Bebas Neue',sans-serif; font-size:clamp(80px,20vw,140px); color:var(--accent); line-height:1; transition:all 0.15s; }
.rep-num.pop { transform:scale(1.15); color:#fff; }
.rep-total { font-family:'DM Mono',monospace; font-size:12px; color:var(--muted); margin-top:4px; }

/* Action buttons */
.guided-actions { width:100%; max-width:400px; padding:0 20px 20px; display:flex; flex-direction:column; gap:12px; flex-shrink:0; }

.rep-btn {
  width:100%; background:var(--accent); border:none; border-radius:14px;
  color:#0a0a0a; font-family:'Bebas Neue',sans-serif; font-size:28px;
  letter-spacing:2px; padding:20px; cursor:pointer;
  transition:transform 0.1s,opacity 0.1s; user-select:none; -webkit-user-select:none;
}
.rep-btn:active { transform:scale(0.97); opacity:0.85; }

.skip-btn {
  width:100%; background:none; border:1px solid var(--border); border-radius:12px;
  color:var(--muted); font-family:'DM Mono',monospace; font-size:11px;
  letter-spacing:2px; text-transform:uppercase; padding:14px; cursor:pointer;
  transition:border-color 0.2s,color 0.2s;
}
.skip-btn:hover { border-color:var(--accent); color:var(--accent); }

/* Rest timer screen */
.rest-screen { display:none; flex-direction:column; align-items:center; justify-content:center; flex:1; width:100%; text-align:center; padding:20px; }
.rest-screen.show { display:flex; }
.rest-label { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:16px; }
.rest-timer { font-family:'Bebas Neue',sans-serif; font-size:clamp(80px,20vw,140px); color:var(--text); line-height:1; }
.rest-next { font-size:14px; color:var(--muted); margin-top:12px; }
.rest-skip-btn { margin-top:24px; background:none; border:1px solid var(--border); border-radius:12px; color:var(--muted); font-family:'DM Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; padding:12px 28px; cursor:pointer; }

/* Complete screen */
.complete-screen { display:none; flex-direction:column; align-items:center; justify-content:center; flex:1; width:100%; text-align:center; padding:32px 20px; }
.complete-screen.show { display:flex; }
.complete-emoji { font-size:64px; margin-bottom:20px; }
.complete-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(48px,12vw,80px); color:var(--accent); letter-spacing:4px; line-height:1; margin-bottom:8px; }
.complete-sub { font-family:'DM Mono',monospace; font-size:12px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:32px; }
.complete-stats { display:flex; gap:20px; margin-bottom:40px; }
.c-stat { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 24px; text-align:center; }
.c-stat-val { font-family:'Bebas Neue',sans-serif; font-size:36px; color:var(--accent); line-height:1; }
.c-stat-lbl { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); letter-spacing:1px; margin-top:4px; text-transform:uppercase; }
.finish-btn { background:var(--accent); border:none; border-radius:12px; color:#0a0a0a; font-family:'DM Mono',monospace; font-size:12px; letter-spacing:3px; text-transform:uppercase; font-weight:500; padding:18px 40px; cursor:pointer; }

/* Confetti */
#confettiCanvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9999; }

.footer-note { font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); opacity:0.35; letter-spacing:2px; text-align:center; padding:20px 0; }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<!-- NAV -->
<nav class="nav-bar">
  <a class="nav-link" href="index.html">⚖ Weight</a>
  <a class="nav-link active" href="workout.html">💪 Workout</a>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-controls">
    <div class="sync-pill" onclick="resetCredentials()">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">LOCAL</span>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>
  </div>
  <div class="hero-title">THE CUT</div>
  <div class="hero-sub">workout tracker</div>
</div>

<!-- PAGE BODY -->
<div class="page-body">
  <div class="grid-2">
    <div class="card">
      <div class="card-label">Today's Workout</div>
      <div id="todayCard"></div>
    </div>
    <div class="card">
      <div class="card-label">This Week</div>
      <div class="week-strip" id="weekStrip"></div>
    </div>
  </div>

  <div class="grid-full">
    <div class="card">
      <div class="card-label">Compliance</div>
      <div class="comp-stats" id="compStats"></div>
      <div id="compBars"></div>
    </div>
  </div>

  <div class="grid-full">
    <div class="card">
      <div class="card-label">Your Weekly Split — tap a day to edit</div>
      <div class="split-list" id="splitList"></div>
    </div>
  </div>

  <div class="footer-note">GITHUB PAGES · THE CUT</div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">Edit Day</div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="rest-toggle">
      <input type="checkbox" id="isRestCheck" onchange="toggleRestMode()">
      <label for="isRestCheck">Rest day</label>
    </div>
    <div id="workoutFields">
      <label class="field-label">Workout Name</label>
      <input class="field-input" id="wkName" placeholder="e.g. Push Day">
      <label class="field-label">Muscle Focus</label>
      <input class="field-input" id="wkFocus" placeholder="e.g. Chest · Shoulders · Triceps">
      <label class="field-label" style="margin-top:20px;">Exercises</label>
      <div class="ex-header"><span>Exercise</span><span>Sets</span><span>Reps</span><span></span></div>
      <div class="ex-editor" id="exEditor"></div>
      <button class="add-ex-btn" onclick="addExRow()">+ Add Exercise</button>
    </div>
    <button class="save-modal-btn" onclick="saveDay()">SAVE</button>
  </div>
</div>

<!-- GUIDED WORKOUT SCREEN -->
<div id="guidedScreen">
  <div class="guided-header">
    <div class="guided-workout-name" id="guidedWorkoutName"></div>
    <button class="guided-close" onclick="exitGuided()">✕ Exit</button>
  </div>

  <div class="guided-progress" id="guidedProgress"></div>

  <!-- Exercise view -->
  <div class="guided-main" id="guidedMain">
    <div class="guided-ex-num" id="guidedExNum"></div>
    <div class="guided-ex-name" id="guidedExName"></div>
    <div class="ex-img-wrap" id="exImgWrap" style="display:none;">
      <img id="exImg" src="" alt="" style="max-height:160px;max-width:100%;border-radius:12px;object-fit:contain;margin:0 auto;display:block;">
    </div>
    <div class="guided-how-to" id="guidedHowTo"></div>
    <div class="set-indicator" id="setIndicator"></div>
    <div class="rep-counter-wrap">
      <div class="rep-label" id="repLabel">Sets remaining</div>
      <div class="rep-num" id="repNum">0</div>
      <div class="rep-total" id="repTotal"></div>
    </div>
  </div>

  <div class="guided-actions" id="guidedActions">
    <button class="rep-btn" id="repBtn" onclick="repDone()">REP DONE ✓</button>
    <button class="skip-btn" onclick="skipExercise()">Skip Exercise</button>
  </div>

  <!-- Rest timer -->
  <div class="rest-screen" id="restScreen">
    <div class="rest-label">Rest</div>
    <div class="rest-timer" id="restTimer">60</div>
    <div class="rest-next" id="restNext"></div>
    <button class="rest-skip-btn" onclick="skipRest()">Skip Rest →</button>
  </div>

  <!-- Complete -->

<script>
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// Exercise image cache
const _imgCache = {};

async function fetchExerciseImage(name) {
  const key = name.toLowerCase().trim();
  if (_imgCache[key]) return _imgCache[key];

  // Hardcoded WGER image URLs for common exercises (no API call needed)
  const KNOWN = {
    'bench press':        'https://wger.de/media/exercise-images/192/Bench-press-1.png',
    'incline bench':      'https://wger.de/media/exercise-images/928/incline-bench-press-1.png',
    'incline db press':   'https://wger.de/media/exercise-images/689/Incline-dumbbell-press-1.png',
    'overhead press':     'https://wger.de/media/exercise-images/63/Overhead-press-1.png',
    'db shoulder press':  'https://wger.de/media/exercise-images/690/Dumbbell-shoulder-press-1.png',
    'arnold press':       'https://wger.de/media/exercise-images/196/Arnold-press-1.png',
    'lateral raises':     'https://wger.de/media/exercise-images/68/Lateral-raise-1.png',
    'lateral raise':      'https://wger.de/media/exercise-images/68/Lateral-raise-1.png',
    'tricep pushdown':    'https://wger.de/media/exercise-images/84/Triceps-pushdown-1.png',
    'skull crushers':     'https://wger.de/media/exercise-images/84/Triceps-pushdown-1.png',
    'cable fly':          'https://wger.de/media/exercise-images/119/Cable-fly-1.png',
    'deadlift':           'https://wger.de/media/exercise-images/86/Deadlift-1.png',
    'romanian deadlift':  'https://wger.de/media/exercise-images/86/Deadlift-1.png',
    'pull-ups':           'https://wger.de/media/exercise-images/75/Pull-up-1.png',
    'pull ups':           'https://wger.de/media/exercise-images/75/Pull-up-1.png',
    'cable row':          'https://wger.de/media/exercise-images/107/Seated-cable-row-1.png',
    'seated row':         'https://wger.de/media/exercise-images/107/Seated-cable-row-1.png',
    'barbell row':        'https://wger.de/media/exercise-images/107/Seated-cable-row-1.png',
    'lat pulldown':       'https://wger.de/media/exercise-images/74/Lat-pulldown-1.png',
    'face pulls':         'https://wger.de/media/exercise-images/318/Face-pull-1.png',
    'barbell curl':       'https://wger.de/media/exercise-images/81/Barbell-curl-1.png',
    'hammer curl':        'https://wger.de/media/exercise-images/82/Hammer-curl-1.png',
    'shrugs':             'https://wger.de/media/exercise-images/115/Dumbbell-shrug-1.png',
    'squat':              'https://wger.de/media/exercise-images/89/Barbell-squat-1.png',
    'barbell squat':      'https://wger.de/media/exercise-images/89/Barbell-squat-1.png',
    'leg press':          'https://wger.de/media/exercise-images/93/Leg-press-1.png',
    'walking lunges':     'https://wger.de/media/exercise-images/182/Walking-lunge-1.png',
    'lunges':             'https://wger.de/media/exercise-images/182/Walking-lunge-1.png',
    'calf raises':        'https://wger.de/media/exercise-images/101/Standing-calf-raise-1.png',
    'calf raise':         'https://wger.de/media/exercise-images/101/Standing-calf-raise-1.png',
  };

  // Check known map first
  for (const k in KNOWN) {
    if (key.includes(k)) {
      _imgCache[key] = KNOWN[k];
      return KNOWN[k];
    }
  }

  // Try WGER API search as fallback
  try {
    const query = encodeURIComponent(name);
    const res = await fetch(`https://wger.de/api/v2/exercise/search/?term=${query}&language=english&format=json`);
    if (res.ok) {
      const data = await res.json();
      const suggestions = data.suggestions || [];
      if (suggestions.length > 0) {
        const exId = suggestions[0].data?.id;
        if (exId) {
          const imgRes = await fetch(`https://wger.de/api/v2/exerciseimage/?exercise=${exId}&format=json`);
          if (imgRes.ok) {
            const imgData = await imgRes.json();
            const main = imgData.results?.find(i => i.is_main) || imgData.results?.[0];
            if (main?.image) {
              _imgCache[key] = main.image;
              return main.image;
            }
          }
        }
      }
    }
  } catch(e) {}

  _imgCache[key] = null;
  return null;
}

function getHowTo(name){
  const key=name.toLowerCase().trim();
  for(const k in HOW_TO){ if(key.includes(k)) return HOW_TO[k]; }
  return HOW_TO['default'];
}

let _data={split:null,log:{}};

function loadLocal(){ try{ return JSON.parse(localStorage.getItem('thecut_workout')||'null'); }catch{ return null; } }
function saveLocal(d){ localStorage.setItem('thecut_workout',JSON.stringify(d)); }

async function cloudRead(){
  const {key,bin}=getCreds(); setSyncStatus('syncing','SYNCING');
  const res=await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`,{headers:{'X-Master-Key':key}});
  if(!res.ok) throw new Error();
  return (await res.json()).record;
}

async function cloudWrite(d){
  const {key,bin}=getCreds();
  let existing={};
  try{ const r=await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`,{headers:{'X-Master-Key':key}}); if(r.ok) existing=(await r.json()).record; }catch{}
  existing.workout=d;
  const res=await fetch(`https://api.jsonbin.io/v3/b/${bin}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':key},body:JSON.stringify(existing)});
  if(!res.ok) throw new Error();
}

async function loadData(){
  if(isConfigured()){
    try{ const rec=await cloudRead(); _data=rec.workout||{split:null,log:{}}; if(!_data.split) _data.split=DEFAULT_SPLIT; if(!_data.log) _data.log={}; saveLocal(_data); setSyncStatus('synced','SYNCED'); }
    catch{ _data=loadLocal()||{split:DEFAULT_SPLIT,log:{}}; setSyncStatus('error','OFFLINE'); }
  }else{ _data=loadLocal()||{split:DEFAULT_SPLIT,log:{}}; setSyncStatus('','LOCAL'); }
}

async function persist(){
  saveLocal(_data);
  if(isConfigured()){ try{ await cloudWrite(_data); setSyncStatus('synced','SYNCED'); }catch{ setSyncStatus('error','SYNC FAILED'); } }
}

function todayDow(){ return new Date().getDay(); }
function dateKey(offset=0){ const d=new Date(); d.setDate(d.getDate()+offset); return `${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`; }
function weekStart(){ const d=new Date(); d.setDate(d.getDate()-d.getDay()); return d; }
function weekDateKey(dow){ const d=weekStart(); d.setDate(d.getDate()+dow); return `${d.getFullYear()}_${d.getMonth()}_${d.getDate()}`; }

// ── TODAY CARD ──
function renderToday(){
  const dow=todayDow(); const day=_data.split[dow]; const key=dateKey(0); const logged=!!_data.log[key];
  const el=document.getElementById('todayCard');
  if(day.rest){ el.innerHTML=`<div class="rest-hero"><div class="rest-title">Rest Day 🛌</div><div class="rest-sub">${DAY_FULL[dow]} · Recovery & recharge</div></div>`; return; }
  const exRows=(day.exercises||[]).map(e=>`<div class="ex-row"><span class="ex-name">${e.name}</span><span class="ex-sets">${e.sets}×${e.reps}</span></div>`).join('');
  el.innerHTML=`
    <div class="today-hero">
      <div class="today-top">
        <div>
          <div class="today-day-label">${DAY_FULL[dow]}</div>
          <div class="today-name">${day.name}</div>
          <div class="today-focus">${day.focus}</div>
        </div>
        <div class="today-btns">
          <button class="start-btn" onclick="startGuided()">▶ Start</button>
          ${logged?`<div class="log-btn logged">✓ Logged</div>`:`<button class="log-btn" onclick="logToday()">Log only</button>`}
        </div>
      </div>
      ${exRows?`<div class="ex-list">${exRows}</div>`:''}
    </div>`;
}

async function logToday(){ _data.log[dateKey(0)]=true; await persist(); renderAll(); }

// ── WEEK STRIP ──
function renderWeekStrip(){
  const todayDOW=todayDow();
  document.getElementById('weekStrip').innerHTML=DAYS.map((l,dow)=>{
    const day=_data.split[dow]; const key=weekDateKey(dow); const logged=!!_data.log[key];
    const isToday=dow===todayDOW; const isRest=day.rest;
    let cls='day-chip'+(logged?' done':isToday?' is-today':isRest?' rest-day':'');
    const icon=logged?'✓':isToday?'◎':isRest?'—':'·';
    return `<div class="${cls}"><div class="dc-letter">${l}</div><div class="dc-icon">${icon}</div><div class="dc-type">${isRest?'Rest':(day.name||'').split(' ')[0]}</div></div>`;
  }).join('');
}

// ── COMPLIANCE ──
function getWeekCompliance(wo=0){ let s=0,d=0; for(let dow=0;dow<7;dow++){ const day=_data.split[dow]; if(day.rest) continue; const dt=weekStart(); dt.setDate(dt.getDate()-wo*7+dow); if(dt>new Date()) continue; s++; const k=`${dt.getFullYear()}_${dt.getMonth()}_${dt.getDate()}`; if(_data.log[k]) d++; } return s===0?null:Math.round((d/s)*100); }
function calcStreak(){ let s=0; for(let i=0;i<60;i++){ const dow=new Date(new Date().setDate(new Date().getDate()-i)).getDay(); if(_data.split[dow].rest) continue; if(_data.log[dateKey(-i)]) s++; else break; } return s; }

function renderCompliance(){
  const tw=getWeekCompliance(0); const streak=calcStreak();
  let total=0,count=0; for(let w=0;w<4;w++){ const c=getWeekCompliance(w); if(c!==null){total+=c;count++;} }
  const avg=count?Math.round(total/count):0;
  document.getElementById('compStats').innerHTML=`<div class="comp-stat"><div class="comp-val green">${tw!==null?tw+'%':'—'}</div><div class="comp-lbl">This week</div></div><div class="comp-stat"><div class="comp-val green">${count?avg+'%':'—'}</div><div class="comp-lbl">4-wk avg</div></div><div class="comp-stat"><div class="comp-val">${streak}</div><div class="comp-lbl">Streak</div></div>`;
  let barsHTML=''; for(let w=3;w>=0;w--){ const c=getWeekCompliance(w); const lbl=w===0?'This wk':w===1?'Last wk':`${w+1} wks ago`; const pct=c!==null?c:0; barsHTML+=`<div class="bar-row"><span class="bar-lbl">${lbl}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-pct">${c!==null?pct+'%':'—'}</span></div>`; }
  document.getElementById('compBars').innerHTML=barsHTML;
}

// ── EDIT MODAL ──
let _editingDow=null;
function openModal(dow){ _editingDow=dow; const day=_data.split[dow]; document.getElementById('modalTitle').textContent=DAY_FULL[dow]; document.getElementById('modalSub').textContent='Edit workout'; const isRest=day.rest||false; document.getElementById('isRestCheck').checked=isRest; document.getElementById('wkName').value=day.name||''; document.getElementById('wkFocus').value=day.focus||''; document.getElementById('workoutFields').style.display=isRest?'none':'block'; renderExEditor(day.exercises||[]); document.getElementById('modalOverlay').classList.add('open'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
function handleOverlayClick(e){ if(e.target===document.getElementById('modalOverlay')) closeModal(); }
function toggleRestMode(){ document.getElementById('workoutFields').style.display=document.getElementById('isRestCheck').checked?'none':'block'; }
function renderExEditor(exercises){ document.getElementById('exEditor').innerHTML=exercises.map((ex,i)=>`<div class="ex-edit-row" id="exrow-${i}"><input class="ex-edit-input" placeholder="Exercise name" value="${ex.name||''}" id="exname-${i}"><input class="ex-edit-input" placeholder="Sets" type="number" value="${ex.sets||''}" id="exsets-${i}" min="1" max="20" inputmode="numeric"><input class="ex-edit-input" placeholder="Reps" type="number" value="${ex.reps||''}" id="exreps-${i}" min="1" max="100" inputmode="numeric"><button class="ex-del-btn" onclick="deleteExRow(${i})">✕</button></div>`).join(''); }
function addExRow(){ const editor=document.getElementById('exEditor'); const count=editor.children.length; const div=document.createElement('div'); div.className='ex-edit-row'; div.id=`exrow-${count}`; div.innerHTML=`<input class="ex-edit-input" placeholder="Exercise name" id="exname-${count}"><input class="ex-edit-input" placeholder="Sets" type="number" id="exsets-${count}" min="1" max="20" inputmode="numeric"><input class="ex-edit-input" placeholder="Reps" type="number" id="exreps-${count}" min="1" max="100" inputmode="numeric"><button class="ex-del-btn" onclick="this.parentElement.remove()">✕</button>`; editor.appendChild(div); }
function deleteExRow(i){ const el=document.getElementById(`exrow-${i}`); if(el) el.remove(); }
async function saveDay(){ const isRest=document.getElementById('isRestCheck').checked; let day={rest:isRest,name:'Rest',focus:'',exercises:[]}; if(!isRest){ day.name=document.getElementById('wkName').value.trim()||'Workout'; day.focus=document.getElementById('wkFocus').value.trim(); document.getElementById('exEditor').querySelectorAll('.ex-edit-row').forEach(row=>{ const n=row.querySelector('[id^="exname"]'); const s=row.querySelector('[id^="exsets"]'); const r=row.querySelector('[id^="exreps"]'); if(n&&n.value.trim()) day.exercises.push({name:n.value.trim(),sets:parseInt(s.value)||3,reps:parseInt(r.value)||10}); }); } _data.split[_editingDow]=day; await persist(); closeModal(); renderAll(); }

// ═══════════════════════════════════════
// GUIDED WORKOUT MODE
// ═══════════════════════════════════════
let G = {
  exercises:[], exIdx:0, setIdx:0,
  totalReps:0, startTime:0, restInterval:null
};

async function startGuided(){
  const dow=todayDow(); const day=_data.split[dow];
  if(!day||day.rest||!day.exercises||!day.exercises.length) return;
  G.exercises=day.exercises; G.exIdx=0; G.setIdx=0; G.startTime=Date.now();
  G.totalReps=0;
  document.getElementById('guidedWorkoutName').textContent=day.name;
  document.getElementById('guidedScreen').classList.add('open');
  await showExercise();
}

async function showExercise(){
  const ex=G.exercises[G.exIdx];
  G.setIdx=G.setIdx||0;

  // hide rest/complete, show main
  document.getElementById('guidedMain').style.display='flex';
  document.getElementById('guidedActions').style.display='flex';
  document.getElementById('restScreen').classList.remove('show');
  document.getElementById('completeScreen').classList.remove('show');

  // progress dots
  document.getElementById('guidedProgress').innerHTML=G.exercises.map((_,i)=>{
    const cls=i<G.exIdx?'prog-dot done-ex':i===G.exIdx?'prog-dot active-ex':'prog-dot';
    return `<div class="${cls}"></div>`;
  }).join('');

  // exercise info
  document.getElementById('guidedExNum').textContent=`Exercise ${G.exIdx+1} of ${G.exercises.length}`;
  document.getElementById('guidedExName').textContent=ex.name;
  document.getElementById('guidedHowTo').textContent=getHowTo(ex.name);

  // Load exercise image
  const imgWrap = document.getElementById('exImgWrap');
  const imgEl = document.getElementById('exImg');
  imgWrap.style.display = 'none';
  fetchExerciseImage(ex.name).then(url => {
    if (url) {
      imgEl.src = url;
      imgEl.onload = () => { imgWrap.style.display = 'block'; };
      imgEl.onerror = () => { imgWrap.style.display = 'none'; };
    }
  });

  // set dots
  const setsLeft=ex.sets-G.setIdx;
  document.getElementById('setIndicator').innerHTML=Array.from({length:ex.sets},(_,i)=>{
    const cls=i<G.setIdx?'set-dot done-set':i===G.setIdx?'set-dot active-set':'set-dot';
    return `<div class="${cls}"></div>`;
  }).join('');

  // set counter (big number = sets remaining)
  document.getElementById('repLabel').textContent=`Sets remaining`;
  document.getElementById('repNum').textContent=setsLeft;
  document.getElementById('repTotal').textContent=`${ex.reps} reps per set · ${ex.sets} sets total`;
  document.getElementById('repBtn').textContent='SET DONE ✓';
  document.getElementById('repBtn').disabled=false;
}

function repDone(){
  const ex=G.exercises[G.exIdx];
  const numEl=document.getElementById('repNum');

  G.setIdx++;
  G.totalReps+=ex.reps;

  // pop animation
  numEl.classList.add('pop');
  setTimeout(()=>numEl.classList.remove('pop'),150);

  if(G.setIdx>=ex.sets){
    // all sets done → next exercise
    G.setIdx=0;
    G.exIdx++;
    if(G.exIdx>=G.exercises.length){
      showComplete();
    }else{
      showRest('Next up: '+G.exercises[G.exIdx].name, async()=>{ await showExercise(); });
    }
  }else{
    // next set, show rest then update counter
    const setsLeft=ex.sets-G.setIdx;
    numEl.textContent=setsLeft;
    showRest(`Set ${G.setIdx+1} of ${ex.sets} next — ${ex.reps} reps`, async()=>{ await showExercise(); });
  }
}

async function skipExercise(){
  G.setIdx=0; G.exIdx++;
  if(G.exIdx>=G.exercises.length) showComplete();
  else await showExercise();
}

// REST TIMER
function showRest(nextLabel, onDone){
  document.getElementById('guidedMain').style.display='none';
  document.getElementById('guidedActions').style.display='none';
  const rs=document.getElementById('restScreen');
  rs.classList.add('show');
  document.getElementById('restNext').textContent=nextLabel;

  let secs=60;
  document.getElementById('restTimer').textContent=secs;

  if(G.restInterval) clearInterval(G.restInterval);
  G.restInterval=setInterval(()=>{
    secs--;
    document.getElementById('restTimer').textContent=secs;
    if(secs<=0){ clearInterval(G.restInterval); rs.classList.remove('show'); onDone(); }
  },1000);

  document.getElementById('restScreen').querySelector('.rest-skip-btn').onclick=()=>{
    clearInterval(G.restInterval); rs.classList.remove('show'); onDone();
  };
}

function skipRest(){ /* handled dynamically above */ }

// COMPLETE
function showComplete(){
  if(G.restInterval) clearInterval(G.restInterval);
  document.getElementById('guidedMain').style.display='none';
  document.getElementById('guidedActions').style.display='none';
  document.getElementById('restScreen').classList.remove('show');
  document.getElementById('guidedProgress').innerHTML='';
  const cs=document.getElementById('completeScreen'); cs.classList.add('show');
  const elapsed=Math.round((Date.now()-G.startTime)/60000);
  document.getElementById('completeSubtitle').textContent=G.exercises[0]&&G.exercises[0].name?'Workout complete!':'';
  document.getElementById('completeStats').innerHTML=`
    <div class="c-stat"><div class="c-stat-val">${G.exercises.length}</div><div class="c-stat-lbl">Exercises</div></div>
    <div class="c-stat"><div class="c-stat-val">${G.totalReps}</div><div class="c-stat-lbl">Total Reps</div></div>
    <div class="c-stat"><div class="c-stat-val">${elapsed}m</div><div class="c-stat-lbl">Duration</div></div>
  `;
  launchConfetti();
}

async function finishWorkout(){
  _data.log[dateKey(0)]=true;
  await persist();
  document.getElementById('guidedScreen').classList.remove('open');
  renderAll();
}

function exitGuided(){
  if(G.restInterval) clearInterval(G.restInterval);
  document.getElementById('guidedScreen').classList.remove('open');
  document.getElementById('restScreen').classList.remove('show');
  document.getElementById('completeScreen').classList.remove('show');
}

// CONFETTI
function launchConfetti(){
  const canvas=document.getElementById('confettiCanvas'); const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const pieces=Array.from({length:150},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height-canvas.height,r:Math.random()*6+3,d:Math.random()*4+2,color:['#c8f542','#ffffff','#f5a623','#ff6b6b','#42d4f5'][Math.floor(Math.random()*5)],tilt:Math.random()*10-10,tiltAngle:0,tiltSpeed:Math.random()*0.1+0.05}));
  let frame=0;
  function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); pieces.forEach(p=>{ ctx.beginPath(); ctx.lineWidth=p.r/2; ctx.strokeStyle=p.color; ctx.moveTo(p.x+p.tilt+p.r/4,p.y); ctx.lineTo(p.x+p.tilt,p.y+p.tilt+p.r/4); ctx.stroke(); p.y+=p.d; p.tiltAngle+=p.tiltSpeed; p.tilt=Math.sin(p.tiltAngle)*12; if(p.y>canvas.height){p.y=-10;p.x=Math.random()*canvas.width;} }); frame++; if(frame<200) requestAnimationFrame(draw); else ctx.clearRect(0,0,canvas.width,canvas.height); }
  draw();
}

function renderAll(){ renderToday(); renderWeekStrip(); renderCompliance(); renderSplitList(); }

async function boot(){ await loadData(); renderAll(); }
boot();
</script>
